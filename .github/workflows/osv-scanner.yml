name: OSV Scanner

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=bun.lock
        --lockfile=ui/bun.lock
        --lockfile=apps/mobile/bun.lock
        --lockfile=site/bun.lock
        --lockfile=src-tauri/Cargo.lock
      fail-on-vuln: true

  browser-extension:
    name: Browser extension supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Check extension permissions, remote code and dependencies
        run: bun run check:browser-extension
