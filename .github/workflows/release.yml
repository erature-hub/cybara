name: Release

# CLI-only, secret-free release channel for erature-hub/cybara.
#
# Scope: build, checksum, publish, and verify the standalone CLI binaries.
# The only credential in play is the automatic `GITHUB_TOKEN` that every
# workflow gets; no repository secret, Actions variable, environment, or
# registry credential is read. The workflow therefore runs in a fresh clone
# with no setup, and it publishes assets that anonymous clients can download.
#
# Deliberately out of scope: the Tauri desktop app, the native macOS app, the
# Android APK, the iOS build, and the npm publish. Those require upstream-owned
# signing material (Apple, Android, Firebase, Expo) or registry tokens that this
# repository does not hold and must not.
#
# Upstream attribution: Cybara is by Carsen Klock, MIT licensed. See NOTICE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (no leading v)."
        required: false
        type: string

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.4"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  SKIP_SPAWN_TESTS: "1"
  # On a tagged release the ref name IS the version (e.g. v1.0.2556). version:sync
  # strips the leading "v" and uses it verbatim, so the shipped binary, the
  # manifests, and the tag all report the same version.
  CYBARA_RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  # -- Quality gate ------------------------------------------------------------
  quality:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install root dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts
      - name: Install UI dependencies
        run: cd ui && bash ../scripts/ci-install.sh
      - name: Install mobile dependencies
        run: cd apps/mobile && bash ../../scripts/ci-install.sh
      - name: Sync version metadata
        run: bun run version:sync
      - name: Install Chromium for browser integration tests
        run: bunx playwright install --with-deps chromium
      - name: Verify packaged Bun release checksums
        run: bun run scripts/verify-bun-runtime-release.ts
      - name: Run CI checks
        run: bun run check:ci
      - name: Security audit
        run: bun run audit:ci

  # -- CLI binaries (cross-compiled on a Linux runner) --------------------------
  build-cli:
    name: CLI ${{ matrix.target }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            artifact: cybara-linux-x64
          - target: linux-arm64
            artifact: cybara-linux-arm64
          - target: darwin-x64
            artifact: cybara-darwin-x64
          - target: darwin-arm64
            artifact: cybara-darwin-arm64
          - target: windows-x64
            artifact: cybara-windows-x64.exe
          - target: windows-arm64
            artifact: cybara-windows-arm64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Type check
        run: bun run typecheck
      - name: Build UI
        run: cd ui && bash ../scripts/ci-install.sh && bun run build
      - name: Build TypeScript
        run: bun run build
      - name: Cross-compile CLI binary
        env:
          CYBARA_BUILD_COMMIT: ${{ github.sha }}
        run: |
          bun run scripts/build-standalone-cli.ts bun-${{ matrix.target }} ${{ matrix.artifact }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  smoke-cli-darwin-x64:
    name: Smoke CLI darwin-x64
    needs: build-cli
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Darwin x64 CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cybara-darwin-x64
      - name: Run Darwin x64 CLI lifecycle
        env:
          CYBARA_SMOKE_HOME: ${{ runner.temp }}/cybara-darwin-x64-home
        run: bash scripts/smoke-standalone-cli.sh ./cybara-darwin-x64

  # -- Publish the release ------------------------------------------------------
  release:
    name: Create Release
    needs: [build-cli, smoke-cli-darwin-x64]
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine tag name
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            echo "name=v${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Flatten artifacts and generate checksums
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          # Label CLI binaries clearly: cybara-v<version>-<target>-cli[.exe]
          VERSION="${TAG#v}"
          for f in cybara-linux-x64 cybara-linux-arm64 cybara-darwin-x64 cybara-darwin-arm64; do
            [ -f "$f" ] && mv "$f" "cybara-v${VERSION}-${f#cybara-}-cli"
          done
          for f in cybara-windows-x64.exe cybara-windows-arm64.exe; do
            stem="${f#cybara-}"
            [ -f "$f" ] && mv "$f" "cybara-v${VERSION}-${stem%.exe}-cli.exe"
          done
          echo "Bundled assets:"
          ls -1
          : > checksums.txt
          for asset in *; do
            [ "$asset" = "checksums.txt" ] && continue
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$asset" >> checksums.txt
            printf '%s  %s\n' "$digest" "$asset" > "${asset}.sha256"
          done
          echo "Checksums:"
          cat checksums.txt
      - name: Create or Update Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  publish-release:
    name: Publish Release
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine tag name
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            echo "name=v${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts
      - name: Sync Nix release hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CHECKSUM_DIR="$RUNNER_TEMP/cybara-nix-checksums"
          rm -rf "$CHECKSUM_DIR"
          mkdir -p "$CHECKSUM_DIR"
          for TARGET in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "cybara-v${VERSION}-${TARGET}-cli.sha256" \
              --dir "$CHECKSUM_DIR"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git checkout -B nix-release-sync origin/main
            bun run scripts/sync-nix-release.ts "$VERSION" "$CHECKSUM_DIR"
            if git diff --quiet -- nix/release.nix; then
              echo "No Nix hash changes for ${VERSION}."
              exit 0
            fi
            git add nix/release.nix
            git commit -m "nix: sync release hashes for v${VERSION} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$ATTEMPT"
          done
          echo "Could not synchronize Nix release hashes after 3 attempts." >&2
          exit 1
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          if [[ "$GITHUB_REF" == *alpha* || "$GITHUB_REF" == *beta* || "$GITHUB_REF" == *rc* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  # -- Post-publish verification ------------------------------------------------
  verify-release:
    name: Verify published assets
    needs: [publish-release, release]
    runs-on: ubuntu-latest
    steps:
      - name: Check release assets are publicly downloadable
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "Verifying published release ${TAG}"
          for asset in \
            "cybara-v${TAG#v}-linux-x64-cli" \
            "cybara-v${TAG#v}-linux-arm64-cli" \
            "cybara-v${TAG#v}-darwin-x64-cli" \
            "cybara-v${TAG#v}-darwin-arm64-cli" \
            "cybara-v${TAG#v}-windows-x64-cli.exe" \
            "cybara-v${TAG#v}-windows-arm64-cli.exe" \
            "checksums.txt"; do
            url="https://github.com/erature-hub/cybara/releases/download/${TAG}/${asset}"
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$url")"
            if [[ "$code" != "200" ]]; then
              echo "Asset not publicly downloadable: $asset (HTTP $code)"
              exit 1
            fi
            echo "OK  $asset"
          done