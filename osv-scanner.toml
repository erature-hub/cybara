[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
ignoreUntil = 2026-12-31
reason = "extract-zip has no patched release; the transitive Puppeteer copy is patched in-tree via patches/extract-zip@2.0.1.patch to reject symlinks that resolve outside the extraction directory. Verified against a malicious ZIP regression test."

[[IgnoredVulns]]
id = "GHSA-7pqw-9j4j-h8q3"
ignoreUntil = 2026-12-31
reason = "extract-zip has no patched release; the same-name symlink-then-file write is blocked by patches/extract-zip@2.0.1.patch, which refuses to create any symlink that resolves outside the extraction directory before a later entry could write through it. Verified against a two-entry malicious ZIP regression test."

# image-size has no patched release: the advisory range is <= 2.0.2 and 2.0.2 is
# the latest published version, so there is nothing to upgrade to and the package
# is pulled in transitively by metro (expo and react-native), which cannot be
# dropped. The vulnerable loops are instead fixed in-tree with a bun patch
# (apps/mobile/patches/image-size@1.2.1.patch) that guards the zero-length ICNS
# entry and zero-size JXL box. These entries suppress the version-range match
# only; the code itself is no longer vulnerable. Remove once upstream ships a fix.
[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-12-31
reason = "image-size JXL/HEIF zero-size box infinite loop is patched in-tree via apps/mobile/patches/image-size@1.2.1.patch; upstream has no fixed release (advisory range <= 2.0.2, latest published 2.0.2). Verified against the advisory proof of concept: unpatched 1.2.1 exhausts the heap, the patched build returns."

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
ignoreUntil = 2026-12-31
reason = "image-size ICNS zero-length entry infinite loop is patched in-tree via apps/mobile/patches/image-size@1.2.1.patch; upstream has no fixed release. Verified against the advisory proof of concept: unpatched 1.2.1 exhausts the heap, the patched build returns."


[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2026-12-31
reason = "Fixed by committed mobile node-forge@1.4.0 patch rejecting extra nested DigestAlgorithm elements. Runtime regression rejects all four previously accepted malformed signatures and retains valid/optional-parameter signatures; security-audit verifies patch registration and installed source before applying this version-only exception. No patched registry release exists as of 2026-10-01."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-31
reason = "deepmerge 4.3.1 is the latest published release with no upstream fix; prototype poisoning in mergeObject() is patched in-tree via apps/mobile/patches/deepmerge@4.3.1.patch by rejecting __proto__ keys on both target and source traversal. security-audit verifies patch registration and installed source before applying this version-only exception. Remove once upstream ships a fix."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2026-12-31
reason = "block-buffer 0.10.4 is the latest 0.10.x release and has no upstream fix in the 0.10 line pulled in transitively by digest 0.10.7 in src-tauri/Cargo.lock. The inline buffer position corruption requires catching a panic inside a digest_blocks closure and reusing the same BlockBuffer instance across catch_unwind, which never occurs in Tauri/RustCrypto hashing paths."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2026-12-31
reason = "zip 4.6.1 reaches the desktop build only through tauri-plugin-updater, and every published tauri-plugin-updater release up to 2.14.0 pins zip ^4, so zip 9.0.0 cannot be selected. The plugin calls ZipArchive::extract only on Windows, where SUID/SGID/sticky bits do not exist, and only on bytes that download() has already verified against the app's minisign public key, so the archive is never attacker-controlled. Remove once tauri-plugin-updater accepts zip 9."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0368"
ignoreUntil = 2026-12-31
reason = "zip 4.6.1 reaches the desktop build only through tauri-plugin-updater, which pins zip ^4 in every release up to 2.14.0. The symlink-target escape needs an attacker-controlled archive; the plugin extracts only on Windows and only after download() verifies the update against the app's minisign public key. Remove once tauri-plugin-updater accepts zip 9."

